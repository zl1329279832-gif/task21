<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政务表单低代码配置系统</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">📋 政务表单配置系统</h1>
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="designer">表单设计</button>
      <button class="tab-btn" data-tab="filler">填报</button>
      <button class="tab-btn" data-tab="preview">预览</button>
      <button class="tab-btn" data-tab="history">历史版本</button>
      <button class="tab-btn" data-tab="io">导入/导出</button>
    </nav>
  </header>

  <main class="app-main">
    <!-- ============ 设计器 ============ -->
    <section id="tab-designer" class="tab-panel active">
      <div class="designer-toolbar">
        <div class="toolbar-left">
          <input type="text" id="template-name" placeholder="模板名称" class="input-text">
          <button id="btn-publish" class="btn btn-primary">发布模板</button>
          <button id="btn-save-draft" class="btn btn-secondary">保存草稿</button>
        </div>
        <div class="toolbar-right">
          <button id="btn-undo" class="btn btn-icon" title="撤销 (Ctrl+Z)" disabled>↩</button>
          <button id="btn-redo" class="btn btn-icon" title="重做 (Ctrl+Y)" disabled>↪</button>
        </div>
      </div>
      <div class="designer-layout">
        <aside class="field-palette" id="field-palette">
          <h3>字段类型</h3>
          <div class="palette-item" draggable="true" data-type="text">
            <span class="palette-icon">📝</span> 文本输入
          </div>
          <div class="palette-item" draggable="true" data-type="number">
            <span class="palette-icon">🔢</span> 数字输入
          </div>
          <div class="palette-item" draggable="true" data-type="date">
            <span class="palette-icon">📅</span> 日期选择
          </div>
          <div class="palette-item" draggable="true" data-type="radio">
            <span class="palette-icon">🔘</span> 单选
          </div>
          <div class="palette-item" draggable="true" data-type="checkbox">
            <span class="palette-icon">☑️</span> 多选
          </div>
          <div class="palette-item" draggable="true" data-type="attachment">
            <span class="palette-icon">📎</span> 附件占位
          </div>
          <div class="palette-item" draggable="true" data-type="address">
            <span class="palette-icon">📍</span> 地址级联
          </div>
          <div class="palette-item" draggable="true" data-type="table">
            <span class="palette-icon">📊</span> 明细表格
          </div>
          <div class="palette-item" draggable="true" data-type="group">
            <span class="palette-icon">📁</span> 分组说明
          </div>
        </aside>

        <div class="designer-canvas" id="designer-canvas">
          <div class="canvas-empty-hint" id="canvas-empty-hint">
            从左侧拖拽字段到此处开始设计表单
          </div>
          <div class="canvas-fields" id="canvas-fields"></div>
        </div>

        <aside class="property-panel" id="property-panel">
          <h3>属性配置</h3>
          <div class="prop-empty" id="prop-empty">选择一个字段以编辑属性</div>
          <div class="prop-content" id="prop-content" style="display:none;"></div>
        </aside>
      </div>
    </section>

    <!-- ============ 填报端 ============ -->
    <section id="tab-filler" class="tab-panel">
      <div class="filler-toolbar">
        <select id="filler-template-select" class="input-select">
          <option value="">-- 选择已发布模板 --</option>
        </select>
        <button id="btn-start-fill" class="btn btn-primary">开始填报</button>
        <button id="btn-save-draft-fill" class="btn btn-secondary" disabled>保存草稿</button>
        <button id="btn-submit-fill" class="btn btn-success" disabled>提交</button>
        <span id="fill-status" class="fill-status"></span>
      </div>
      <div class="filler-content" id="filler-content">
        <div class="filler-empty">请选择一个已发布的模板开始填报</div>
      </div>
    </section>

    <!-- ============ 预览 ============ -->
    <section id="tab-preview" class="tab-panel">
      <div class="preview-toolbar">
        <select id="preview-template-select" class="input-select">
          <option value="">-- 选择模板预览 --</option>
        </select>
        <button id="btn-preview-template" class="btn btn-primary">生成预览</button>
        <button id="btn-print-preview" class="btn btn-secondary">打印预览</button>
      </div>
      <div class="preview-content" id="preview-content">
        <div class="preview-empty">选择模板后点击"生成预览"</div>
      </div>
    </section>

    <!-- ============ 历史版本 ============ -->
    <section id="tab-history" class="tab-panel">
      <div class="history-toolbar">
        <select id="history-template-select" class="input-select">
          <option value="">-- 选择模板 --</option>
        </select>
        <button id="btn-load-history" class="btn btn-primary">加载版本</button>
      </div>
      <div class="history-content" id="history-content">
        <div class="history-list" id="history-list"></div>
        <div class="history-detail" id="history-detail"></div>
      </div>
    </section>

    <!-- ============ 导入导出 ============ -->
    <section id="tab-io" class="tab-panel">
      <div class="io-layout">
        <div class="io-section">
          <h3>模板导出</h3>
          <select id="export-template-select" class="input-select">
            <option value="">-- 选择模板 --</option>
          </select>
          <button id="btn-export-template" class="btn btn-primary">导出模板 JSON</button>
          <pre id="export-template-output" class="output-box"></pre>
        </div>
        <div class="io-section">
          <h3>模板导入</h3>
          <textarea id="import-template-input" class="input-textarea" placeholder="粘贴模板 JSON..."></textarea>
          <input type="file" id="import-template-file" accept=".json">
          <button id="btn-import-template" class="btn btn-primary">导入模板</button>
          <div id="import-template-result" class="result-box"></div>
        </div>
        <div class="io-section">
          <h3>填报数据导出</h3>
          <select id="export-data-template" class="input-select">
            <option value="">-- 选择模板 --</option>
          </select>
          <select id="export-data-record" class="input-select">
            <option value="">-- 选择记录 --</option>
          </select>
          <div style="margin:8px 0;display:flex;gap:12px;">
            <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
              <input type="radio" name="export-view-mode" value="original" checked> 原始版本视图
            </label>
            <label style="font-size:12px;display:flex;align-items:center;gap:4px;">
              <input type="radio" name="export-view-mode" value="migration"> 迁移视图
            </label>
          </div>
          <button id="btn-export-data-json" class="btn btn-primary">导出 JSON</button>
          <button id="btn-export-data-csv" class="btn btn-secondary">导出 CSV</button>
          <pre id="export-data-output" class="output-box"></pre>
        </div>
      </div>
    </section>
  </main>

  <!-- 模态对话框 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-dialog" id="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/engine.js"></script>
  <script src="js/designer.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
